<main>
  <section>
    <div class="fondo">
      <div class="overlay">
          <img src="img/santino-logo.png" alt="Logo de Santino" class="logo">
          <h1 id="frase-logo">Diseños funcionales y elegantes para el corazón de tu hogar</h1>
          <app-button></app-button>
      </div>
    </div>
  </section>

  <section class="resumen">
    
    <div class="imagen-resumen">
      <div class="imagen-resumen-icon">
        <img src="img/apreton-de-manos (3).png" alt="Apretón de manos" class="img">
      </div>
      <h2>Comprometidos con tu confianza</h2>
    </div>
    <div class="imagen-resumen">
      <div class="imagen-resumen-icon">
        <img src="img/martillo (1).png" alt="Martillo" class="img">
      </div>
      <h2>Diseñamos con experiencia, fabricamos con valores</h2>
    </div>
    <div class="imagen-resumen">
      <div class="imagen-resumen-icon">
        <img src="img/calidad.png" alt="Materiales de calidad" class="img">
      </div>
      <h2>Materiales de calidad</h2>
    </div>
  </section>
    <app-slider-inicio></app-slider-inicio>

  <section>
    <h2>¿Comó lo logramos?</h2>
    <div class="video-container">
      <p>Cada proyecto comienza con una idea.</p>
      <video width="320" height="240" controls>
        <source src="video/Carpinteria.mp4" type="video/mp4">
      </video>
    </div>
    <div class="video-container">
      <p>Tu formas parte de esa idea.</p>
      <video width="320" height="240" controls>
        <source src="video/Carpinteria.mp4" type="video/mp4">
      </video>
    </div>
    <div class="video-container">
      <p>Nostros la modelamos</p>
      <div class="img-comp-container" #imgCompContainer>
        <div class="img-comp-img">
          <img src="img/cocina1.jpg" alt="Before image">
        </div>
        <div class="img-comp-img img-comp-overlay" #imgCompOverlay>
          <img src="img/cocina2.jpeg" alt="After image">
        </div>
        <div class="img-comp-slider" #imgCompSlider></div>
      </div>
    </div>
  </section>
</main>
