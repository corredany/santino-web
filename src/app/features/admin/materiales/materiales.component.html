<div class="page-header">
  <h1>Materiales</h1>
</div>

<div class="upload-panel">
  <h2>Subir material</h2>
  <div class="form-row">
    <div class="form-group">
      <label>Nombre *</label>
      <input type="text" [(ngModel)]="nombre" placeholder="Ej. Granito blanco">
    </div>
    <div class="form-group">
      <label>Descripción</label>
      <input type="text" [(ngModel)]="descripcion">
    </div>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label>Sección</label>
      <select [(ngModel)]="seccionId" (change)="cargar()">
        <option [ngValue]="undefined">Todas</option>
        @for (s of secciones; track s.id) {
          <option [ngValue]="s.id">{{ s.nombre }}</option>
        }
      </select>
    </div>
    <div class="form-group">
      <label>Orden</label>
      <input type="number" [(ngModel)]="orden">
    </div>
  </div>
  <div class="upload-area" (click)="fileInput.click()">
    <input #fileInput type="file" accept="image/*,application/pdf" style="display:none" (change)="onFileChange($event)">
    {{ archivo ? archivo.name : 'Haz clic para seleccionar el archivo' }}
  </div>
  <button class="btn-primary" (click)="subir()" [disabled]="!archivo || !nombre || subiendo">
    {{ subiendo ? 'Subiendo...' : 'Subir material' }}
  </button>
</div>

@if (cargando) { <p class="loading-msg">Cargando...</p> }

<div class="grid-imgs">
  @for (m of materiales; track m.id) {
    <div class="img-card">
      <img [src]="m.url" [alt]="m.nombre">
      <div class="img-card-footer" style="flex-direction: column; align-items: flex-start; padding: 0.5rem;">
        <span style="font-size:0.8rem; font-weight:600;">{{ m.nombre }}</span>
        <button class="btn-delete" style="margin-top:0.35rem" (click)="eliminar(m.id)">Eliminar</button>
      </div>
    </div>
  }
</div>
