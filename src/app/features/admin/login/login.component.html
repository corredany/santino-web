<div class="login-page">
  <div class="login-card">
    <img src="img/santino.png" alt="Santino" class="login-logo">
    <h1>Panel Administrativo</h1>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" required autocomplete="current-password">
      </div>

      @if (error) {
        <p class="error-msg">{{ error }}</p>
      }

      <button type="submit" [disabled]="cargando">
        {{ cargando ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>
