<div class="page-header">
  <h1>Imágenes</h1>
</div>

<div class="upload-panel">
  <h2>Subir imagen</h2>
  <div class="form-row">
    <div class="form-group">
      <label>Sección (opcional)</label>
      <select [(ngModel)]="seccionId" (change)="cargar()">
        <option [ngValue]="undefined">Todas</option>
        @for (s of secciones; track s.id) {
          <option [ngValue]="s.id">{{ s.nombre }}</option>
        }
      </select>
    </div>
    <div class="form-group">
      <label>Orden</label>
      <input type="number" [(ngModel)]="orden">
    </div>
  </div>
  <div class="upload-area" (click)="fileInput.click()">
    <input #fileInput type="file" accept="image/*" style="display:none" (change)="onFileChange($event)">
    {{ archivoSeleccionado ? archivoSeleccionado.name : 'Haz clic para seleccionar una imagen' }}
  </div>
  <button class="btn-primary" (click)="subir()" [disabled]="!archivoSeleccionado || subiendo">
    {{ subiendo ? 'Subiendo...' : 'Subir imagen' }}
  </button>
</div>

@if (cargando) { <p class="loading-msg">Cargando imágenes...</p> }

<div class="grid-imgs">
  @for (img of imagenes; track img.id) {
    <div class="img-card">
      <img [src]="img.url" [alt]="'Imagen ' + img.id">
      <div class="img-card-footer">
        <button class="btn-delete" (click)="eliminar(img.id)">Eliminar</button>
      </div>
    </div>
  }
</div>
