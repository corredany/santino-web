<section>
    <p id="titulo">Nuestros servicios</p>
    <swiper-container #swiper init="true">
        <swiper-slide *ngFor="let slide of slides">
            <div class="card-list">
                <div class="card-item">
                    <p class="user-profession">{{ slide.name}}</p>
                    <img [src]="slide.image" [alt]="slide.name + ' Image'" class="user-image">
                    <button class="message-button">Conoce más</button>
                </div>
            </div>
        </swiper-slide>
    </swiper-container>
</section>
